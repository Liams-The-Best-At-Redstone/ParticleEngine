<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        button {
            padding: 6px 12px;
            cursor: pointer;
            background: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
        }
        select {
            padding: 6px 12px;
            cursor: pointer;
            background: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
        }
        button.active {
            background: #007bff;
            border-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="ui-panel">
        <div class="control-group">
            <label for="particle-selector">Add Particle:</label>
            <select id="particle-selector">
                <option value="BLUE" selected>Blue</option>
                <option value="RED">Red</option>
                <option value="GREEN">Green</option>
            </select>
            <button id="mode-add" class="active">Spawn Particles</button>
        </div>
        <button id="mode-remove">Remove Particles</button>
        <button id="mode-move">Move Particles</button>
        <div class="force-group">
            <button id="enable-force-table">Force Table</button>
            <table id="force-table">
                <tr>
                    <th>Type</th>
                    <th>Blue</th>
                    <th>Red</th>
                    <th>Green</th>
                </tr>
                <tr>
                    <th>Blue</th>
                    <th id="blue-to-blue"></th>
                    <th id="blue-to-red"></th>
                    <th id="blue-to-green"></th>
                </tr>
                <tr>
                    <th>Red</th>
                    <th id="red-to-blue"></th>
                    <th id="red-to-red"></th>
                    <th id="red-to-green"></th>
                </tr>
                <tr>
                    <th>Green</th>
                    <th id="green-to-blue"></th>
                    <th id="green-to-red"></th>
                    <th id="green-to-green"></th>
                </tr>
            </table>
        <button id="clear">Clear</button>
    </div>
    <canvas id="particle-life"></canvas>

    <script src="sim.js" defer></script>
</body>
</html>
