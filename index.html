<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-panel">
        <div class="control-group">
            <label for="particle-selector">Add Particle:</label>
            <select id="particle-selector">
                <option value="BLUE" selected>Blue</option>
                <option value="RED">Red</option>
                <option value="GREEN">Green</option>
            </select>
            <button id="mode-add" class="active">Spawn Particles</button>
        </div>
        <button id="mode-remove">Remove Particles</button>
        <button id="mode-move">Move Particles</button>
        <button id="clear">Clear</button>
        <div class="table-group">
            <button id="toggle-force-table">Force Table</button>
            <table id="force-table" hidden>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Blue</th>
                        <th>Red</th>
                        <th>Green</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>Blue</th>
                        <th><input id="blue-to-blue-force" type="number" value="1"></th>
                        <th><input id="blue-to-red-force" type="number" value="1"></th>
                        <th><input id="blue-to-green-force" type="number" value="1"></th>
                    </tr>
                    <tr>
                        <th>Red</th>
                        <th><input id="red-to-blue-force" type="number" value="1"></th>
                        <th><input id="red-to-red-force" type="number" value="1"></th>
                        <th><input id="red-to-green-force" type="number" value="1"></th>
                    </tr>
                    <tr>
                        <th>Green</th>
                        <th><input id="green-to-blue-force" type="number" value="1"></th>
                        <th><input id="green-to-red-force" type="number" value="1"></th>
                        <th><input id="green-to-green-force" type="number" value="1"></th>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="table-group">
            <button id="toggle-repel-table">Repel Table</button>
            <table id="repel-table" hidden>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Blue</th>
                        <th>Red</th>
                        <th>Green</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>Blue</th>
                        <th><input id="blue-to-blue-repel" type="number" value="15"></th>
                        <th><input id="blue-to-red-repel" type="number" value="15"></th>
                        <th><input id="blue-to-green-repel" type="number" value="15"></th>
                    </tr>
                    <tr>
                        <th>Red</th>
                        <th><input id="red-to-blue-repel" type="number" value="15"></th>
                        <th><input id="red-to-red-repel" type="number" value="15"></th>
                        <th><input id="red-to-green-repel" type="number" value="15"></th>
                    </tr>
                    <tr>
                        <th>Green</th>
                        <th><input id="green-to-blue-repel" type="number" value="15"></th>
                        <th><input id="green-to-red-repel" type="number" value="15"></th>
                        <th><input id="green-to-green-repel" type="number" value="15"></th>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <canvas id="particle-life"></canvas>

    <script src="sim.js" defer></script>
</body>
</html>
